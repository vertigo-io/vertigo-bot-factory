<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:vu="http://www.morphbit.com/thymeleaf/component"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{templates/botDetailLayout}" th:with="nav=true, tab=valueLists"
>

<head>
    <title th:text="#{valueList.detail.title}"></title>
    <script>
        const valueListBaseUrl = /*[[@{/bot/{id}/valueList/(id=${model.bot.botId})}]]*/ '';
        const valueListItemRequiredMessage = /*[[#{valueListItem.required}]]*/ '';

        VUiExtensions.methods = {
            ...VUiExtensions.methods,

            requiredValueListItemField: function(val) {
                return (!!val && val.trim().length > 0) || valueListItemRequiredMessage;
            },

            isValueListCreation: function() {
                return this.vueData.jiraValueList.jirValListId === null || this.vueData.jiraValueList.jirValListId === undefined;
            },

            openValueListItemDialog: function(row) {
                Object.assign(this.vueData.newJiraValueListItem, {
                    jirValItemId: row ? (row.jirValItemId ?? null) : null,
                    jirValListId: this.vueData.jiraValueList.jirValListId,
                    code: row ? row.code : null,
                    label: row ? row.label : null
                });
                this.dataX.editedItemIndex = row ? this.vueData.jiraValueListItems.indexOf(row) : -1;
                this.$refs.valueListItemDialog.show();
            },

            onValueListItemSubmit: function() {
                const dialog = this.$refs.valueListItemDialog;
                if (this.isValueListCreation()) {
                    // La liste n'existe pas encore : les valeurs sont enregistrées avec elle
                    const item = {code: this.vueData.newJiraValueListItem.code, label: this.vueData.newJiraValueListItem.label};
                    if (this.dataX.editedItemIndex >= 0) {
                        this.vueData.jiraValueListItems.splice(this.dataX.editedItemIndex, 1, item);
                    } else {
                        this.vueData.jiraValueListItems.push(item);
                    }
                    dialog.hide();
                    return;
                }
                VUiPage.httpPostAjax('_saveValueListItem', this.vueDataParams(['newJiraValueListItem']), {
                    onSuccess: function() {
                        dialog.hide();
                    }
                });
            },

            deleteValueListItem: function(row) {
                if (this.isValueListCreation()) {
                    this.vueData.jiraValueListItems.splice(this.vueData.jiraValueListItems.indexOf(row), 1);
                    return;
                }
                this.componentStates.jirValItemId = row.jirValItemId;
                this.componentStates.showPopupDeleteValueListItem.shown = true;
            },

            openImportValueListDialog: function() {
                this.vueData.importValueListFileUri = [];
                this.$refs.importValueListDialog.show();
            },

            importValueListItems: function() {
                const dialog = this.$refs.importValueListDialog;
                VUiPage.httpPostAjax('_importValueListItems', {
                    'importValueListFileUri': this.vueData.importValueListFileUri.toString()
                }, {
                    onSuccess: function() {
                        dialog.hide();
                    }
                });
            },

            saveValueList: function() {
                const params = this.vueDataParams(['jiraValueList']);
                const items = this.vueData.jiraValueListItems.map(item => ({code: item.code, label: item.label}));
                params.append('items', JSON.stringify(items));
                VUiPage.httpPostAjax('_save', params, {
                    onSuccess: function() {
                        window.location.href = valueListBaseUrl + VertigoUi.vueData.jiraValueList.jirValListId;
                    }
                });
            }
        };

        VUiExtensions.dataX.editedItemIndex = -1;
    </script>
</head>

<body>
<section layout:fragment="content-actions">
    <vu:button-link th:if="${model.modeEdit}" url="@{/bot/{id}/valueList/(id=${model.bot.botId})} + ${model.jiraValueList.jirValListId}"
                    th:title="#{action.cancel}" icon="fas fa-ban"
                    class="on-left text-accent-inverted" :round size="md" color="primary" :flat/>
    <vu:button-link th:if="${model.modeCreate}" url="@{/bot/{id}/valueLists/(id=${model.bot.botId})}"
                    th:title="#{action.cancel}" icon="fas fa-ban"
                    class="on-left text-accent-inverted" :round size="md" color="primary" :flat/>
    <vu:button-submit th:if="${model.modeReadOnly && model.userAuthorizations[AtzChatbot$botAdm]}" action="@{_edit}"
                      th:title="#{action.edit}" icon="edit"
                      class="on-left" :round size="md" color="primary"/>
    <q-btn th:if="${model.modeReadOnly && model.userAuthorizations[AtzChatbot$botAdm]}"
           @click="componentStates.showPopupDeleteValueList.shown = true"
           th:aria-label="#{action.delete}" th:title="#{action.delete}" icon="delete"
           class="on-left" round size="md" color="red"></q-btn>
</section>

<section layout:fragment="content">
    <vu:popup action="_delete" vModel="showPopupDeleteValueList"
              message="#{valueList.popup.delete.message}" confirm="#{action.confirm}"></vu:popup>
    <vu:popup-ajax action="_deleteValueListItem" vModel="showPopupDeleteValueListItem" dataName="jirValItemId"
                   message="#{valueListItem.popup.delete.message}" confirm="#{action.confirm}"></vu:popup-ajax>

    <vu:include-data object="jiraValueList" field="jirValListId" modifiable="true"/>
    <vu:include-data object="jiraValueList" field="botId" modifiable="true"/>
    <vu:include-data object="jiraValueListItems" field="'*'"/>

    <vu:block id="detail" th:title="#{valueList.detail.informations}">
        <vu:grid cols="3">
            <vu:text-field object="jiraValueList" field="code"/>
            <vu:text-field object="jiraValueList" field="label"/>
            <q-field th:label="#{valueList.itemCount}" stack-label borderless>
                <template v-slot:control>
                    <div class="self-center full-width no-outline">{{ vueData.jiraValueListItems.length }}</div>
                </template>
            </q-field>
        </vu:grid>
    </vu:block>

    <div class="text-h6 text-weight-bold" style="display: flex; align-items: center; margin-top: 2rem;">
        <span class="text-primary" style="flex-grow: 2">[[#{valueList.values}]]</span>
        <q-btn th:if="${model.userAuthorizations[AtzChatbot$botAdm]}"
               color="primary" round icon="add" th:aria-label="#{valueList.addValue}" th:title="#{valueList.addValue}"
               @click="openValueListItemDialog(null)"></q-btn>
        <q-btn th:if="${!model.modeCreate && model.userAuthorizations[AtzChatbot$botAdm]}"
               class="on-right" color="primary" round icon="file_download"
               th:aria-label="#{valueList.importValues}" th:title="#{valueList.importValues}"
               @click="openImportValueListDialog()"></q-btn>
    </div>

    <vu:table list="jiraValueListItems" componentId="jiraValueListItems" rowsPerPage="20" autoColClass>
        <vu:slot name="actions_slot" th:if="${model.userAuthorizations[AtzChatbot$botAdm]}">
            <q-btn class="on-right" round color="primary" icon="edit" th:aria-label="#{action.edit}" th:title="#{action.edit}"
                   @click="openValueListItemDialog(props.row)"></q-btn>
            <q-btn class="on-right" round color="red" icon="delete" th:aria-label="#{action.delete}" th:title="#{action.delete}"
                   @click="deleteValueListItem(props.row)"></q-btn>
        </vu:slot>
        <vu:column field="code"/>
        <vu:column field="label"/>
    </vu:table>

    <q-dialog ref="valueListItemDialog">
        <vu:include-data object="newJiraValueListItem" field="jirValItemId" modifiable="true"/>
        <vu:include-data object="newJiraValueListItem" field="jirValListId" modifiable="true"/>
        <vu:include-data object="newJiraValueListItem" field="code" modifiable="true"/>
        <vu:include-data object="newJiraValueListItem" field="label" modifiable="true"/>
        <q-card style="width: 400px;">
            <q-form @submit="onValueListItemSubmit" class="q-gutter-md">
                <q-card-section>
                    <div class="text-h6">
                        <span v-if="vueData.newJiraValueListItem.jirValItemId !== null || dataX.editedItemIndex >= 0"
                              th:text="#{valueListItem.update.popup.title}"></span>
                        <span v-else th:text="#{valueListItem.add.popup.title}"></span>
                    </div>
                </q-card-section>
                <q-card-section>
                    <div class="row q-col-gutter-md">
                        <div class="col-6">
                            <q-input v-model="vueData.newJiraValueListItem.code" th:label="#{fldJiraValueListItem$code}"
                                     :rules="[requiredValueListItemField]"></q-input>
                        </div>
                        <div class="col-6">
                            <q-input v-model="vueData.newJiraValueListItem.label" th:label="#{fldJiraValueListItem$label}"
                                     :rules="[requiredValueListItemField]"></q-input>
                        </div>
                    </div>
                </q-card-section>
                <q-card-actions align="around">
                    <input type="hidden" name="CTX" :value="vueData['CTX']">
                    <q-btn th:label="#{action.cancel}" color="red" v-close-popup></q-btn>
                    <q-btn th:title="#{action.save}" th:label="#{action.save}" th:aria-label="#{action.save}"
                           color="primary" type="submit"></q-btn>
                </q-card-actions>
            </q-form>
        </q-card>
    </q-dialog>

    <q-dialog ref="importValueListDialog" th:if="${!model.modeCreate && model.userAuthorizations[AtzChatbot$botAdm]}" th:with="viewMode='edit'">
        <q-card style="width: 500px;">
            <q-card-section>
                <div class="text-h6" th:text="#{valueList.import.popup.title}"></div>
                <div class="text-body2 q-mt-sm" th:text="#{valueList.import.popup.help}"></div>
            </q-card-section>
            <q-card-section>
                <vu:include-data-primitive key="locale"/>
                <vu:fileupload th:url="'@{/commons/upload}'" key="importValueListFileUri" multiple="false"
                               th:with="object=null, field=null" accept="'.csv'"/>
            </q-card-section>
            <q-card-actions align="around">
                <q-btn th:label="#{action.cancel}" color="red" v-close-popup></q-btn>
                <q-btn th:title="#{action.import}" th:label="#{action.import}" th:aria-label="#{action.import}"
                       color="primary" @click="importValueListItems()"></q-btn>
            </q-card-actions>
        </q-card>
    </q-dialog>

    <q-page-sticky position="bottom-right">
        <q-btn th:if="${!model.modeReadOnly}" icon="save" th:label="#{action.save}" th:title="#{action.save}"
               th:aria-label="#{action.save}" size="lg" color="primary"
               @click="saveValueList()"></q-btn>
    </q-page-sticky>
</section>
</body>
</html>
