<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        xmlns:vu="http://www.morphbit.com/thymeleaf/component"
        layout:decorate="~{templates/botDetailLayout}" th:with="nav=true, tab=welcometours"
>

<head>
    <title th:text="#{extensions.welcometour}"></title>
    <script th:inline="javascript">
        VUiExtensions.dataX.attachmentError = {'show': false, 'message': ''};

        VUiExtensions.methods = {
            ...VUiExtensions.methods,

            addWelcomeTour: function() {
                VUiPage.httpPostAjax("_saveWelcomeTour", this.vueDataParams(['newWelcomeTour']), {
                    onSuccess: function() {
                        this.$refs.welcomeTourDialog.hide();
                    }
                });
            },
        }

        function onStart() {
            VUiExtensions.dataX.attachmentError = {'show': false, 'message': ''};
        }

    </script>
</head>

<body>
<section th:if="${model.userAuthorizations[AtzChatbot$botContributor]}" layout:fragment="content-actions">
    <vu:include-data-primitive key="locale"/>
    <q-btn color="primary" round icon="add" th:aria-label="#{action.add}" th:title="#{action.add}"
           @click="vueData.newWelcomeTour.welId = null;
                       vueData.newWelcomeTour.botId = vueData.bot.botId;
                       vueData.newWelcomeTour.label = null;
                       vueData.newWelcomeTour.technicalCode = null;
                       vueData.newWelcomeTour.useModalOverlay = null;
                       vueData.newWelcomeTour.useCancelIcon = null;
                       vueData.newWelcomeTour.nextButtonLabel = vueData.locale == 'fr_FR' ? 'Suivant' : 'Next';
                       vueData.newWelcomeTour.previousButtonLabel = vueData.locale == 'fr_FR' ? 'Précédent' : 'Previous';
                       vueData.newWelcomeTour.completeButtonLabel = vueData.locale == 'fr_FR' ? 'Terminer' : 'Complete';
                       vueData.newWelcomeTour.stepsCssClasses = 'sheperd-content'
                       $refs.welcomeTourDialog.show()">
    </q-btn>
</section>

<section layout:fragment="content">

    <div class="text-h6 text-weight-bold" style="display: flex; align-items: center" >
        <span class="text-primary" style="flex-grow: 2">[[#{layout.welcometours}]]</span>
        <q-icon name="help_outlined" size="2rem"/>
        <q-tooltip content-class="q-tooltip-text">[[#{welcometours.tooltip}]]</q-tooltip>
    </div>

    <vu:include-data-primitive key="locale"/>
    <vu:include-data object="bot" field="botId" />
    <vu:popup-ajax action="_deleteWelcomeTour" vModel="showDeleteWelcomeTourPopup" th:message="#{extension.welcometour.delete.popup.message}"
                   th:confirm="#{action.delete}" dataName="welId" ></vu:popup-ajax>
    <vu:table id="WELCOMETOUR" list="welcomeTours" componentId="welcomeTours" sortBy="label" :binary-state-sort="true">

        <vu:slot name="actions_slot">
            <q-btn th:if="${model.userAuthorizations[AtzChatbot$botContributor]}" class="on-right" round color="primary" icon="edit" th:aria-label="#{action.update}" th:title="#{action.update}"
                   @click="vueData.newWelcomeTour.botId = props.row.botId;
                           vueData.newWelcomeTour.welId = props.row.welId;
                           vueData.newWelcomeTour.label = props.row.label;
                           vueData.newWelcomeTour.technicalCode = props.row.technicalCode;
                           vueData.newWelcomeTour.useModalOverlay = props.row.useModalOverlay;
                           vueData.newWelcomeTour.useCancelIcon = props.row.useCancelIcon;
                           vueData.newWelcomeTour.nextButtonLabel = props.row.nextButtonLabel;
                           vueData.newWelcomeTour.previousButtonLabel = props.row.previousButtonLabel;
                           vueData.newWelcomeTour.completeButtonLabel = props.row.completeButtonLabel;
                           vueData.newWelcomeTour.stepsCssClasses = props.row.stepsCssClasses;
                           $refs.welcomeTourDialog.show()">
            </q-btn>
            <q-btn th:if="${model.userAuthorizations[AtzChatbot$botContributor]}" class="on-right" round color="red" icon="delete" th:aria-label="#{action.delete}" th:title="#{action.delete}"
                   @click="componentStates.welId = props.row.welId;
                           componentStates.showDeleteWelcomeTourPopup.shown = true">
            </q-btn>
        </vu:slot>
        <vu:include-data object="welcomeTours" field="*" />
        <vu:column style="cursor : pointer;" field="label">
            <a style="display:block; height:100%; width:100%; text-decoration:none; color:black;"
               th::href="|'@{/bot/{id}/welcomeToursSteps/(id=${model.bot.botId})}'+props.row.welId|">
                <span style="height:100%" class="row items-center">{{props.row.label}}</span>
            </a>
        </vu:column>
        <vu:column style="cursor : pointer;" field="technicalCode">
            <a style="display:block; height:100%; width:100%; text-decoration:none; color:black;"
               th::href="|'@{/bot/{id}/welcomeToursSteps/(id=${model.bot.botId})}'+props.row.welId|">
                <span style="height:100%" class="row items-center">{{props.row.technicalCode}}</span>
            </a>
        </vu:column>
    </vu:table>
    <th:block th:with="viewMode='edit'">
        <q-dialog ref="welcomeTourDialog" @hide="delete uiMessageStack.objectFieldErrors.newWelcomeTour">
            <vu:include-data object="newWelcomeTour" field="botId" modifiable="true" />
            <vu:include-data object="newWelcomeTour" field="welId" modifiable="true" />
            <vu:include-data object="newWelcomeTour" field="label" modifiable="true" />
            <vu:include-data object="newWelcomeTour" field="technicalCode"  modifiable="true" />
            <vu:include-data object="newWelcomeTour" field="useModalOverlay"  modifiable="true" />
            <vu:include-data object="newWelcomeTour" field="useCancelIcon"  modifiable="true" />
            <vu:include-data object="newWelcomeTour" field="nextButtonLabel"  modifiable="true" />
            <vu:include-data object="newWelcomeTour" field="previousButtonLabel"  modifiable="true" />
            <vu:include-data object="newWelcomeTour" field="completeButtonLabel"  modifiable="true" />
            <vu:include-data object="newWelcomeTour" field="stepsCssClasses"  modifiable="true" />
            <q-card style="width: 45rem">
                <q-form @submit="addWelcomeTour" class="q-gutter-md">
                <q-card-section>
                    <div class="text-h6">
                        <span v-if="vueData.newWelcomeTour.welId !== null" th:text="#{extensions.welcometour.update.popup.title}"></span>
                        <span v-else th:text="#{extensions.welcometour.add.popup.title}"></span>
                    </div>
                </q-card-section>
                <q-card-section>
                    <vu:grid cols="2">
                        <vu:text-field object="newWelcomeTour" field="label"/>
                        <vu:text-field object="newWelcomeTour" field="technicalCode"/>
                    </vu:grid>
                </q-card-section>
                <q-card-section>
                    <vu:grid cols="2">
                        <vu:label object="newWelcomeTour" field="useModalOverlay">
                            <q-input v-model="vueData.newWelcomeTour.useModalOverlay" name="vContext[newWelcomeTour][useModalOverlay]" class="hidden" ></q-input>
                            <q-toggle v-model="vueData.newWelcomeTour.useModalOverlay"></q-toggle>
                        </vu:label>
                        <vu:label object="newWelcomeTour" field="useCancelIcon">
                            <q-input v-model="vueData.newWelcomeTour.useCancelIcon" name="vContext[newWelcomeTour][useCancelIcon]" class="hidden" ></q-input>
                            <q-toggle v-model="vueData.newWelcomeTour.useCancelIcon"></q-toggle>
                        </vu:label>
                    </vu:grid>
                </q-card-section>
                <q-card-section>
                    <vu:grid cols="2">
                        <vu:text-field object="newWelcomeTour" field="previousButtonLabel"/>
                        <vu:text-field object="newWelcomeTour" field="nextButtonLabel"/>
                    </vu:grid>
                </q-card-section>
                    <q-card-section>
                        <vu:grid cols="2">
                            <vu:text-field object="newWelcomeTour" field="completeButtonLabel"/>
                            <vu:text-field object="newWelcomeTour" field="stepsCssClasses"/>
                        </vu:grid>
                    </q-card-section>
                <q-card-actions align="around">
                    <input type="hidden" name="CTX" :value="vueData['CTX']">
                    <q-btn th:label="#{action.cancel}" color="red" v-close-popup></q-btn>
                    <q-btn th:title="#{action.save}" th:label="#{action.save}" th:aria-label="#{action.save}"
                           type="submit" color="primary"></q-btn>
                </q-card-actions>
                </q-form>
            </q-card>
        </q-dialog>
    </th:block>
</section>
</body>
</html>
