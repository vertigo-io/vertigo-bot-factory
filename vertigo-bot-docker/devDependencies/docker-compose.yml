# docker-compose example file
#
# Passwords / API key can be, for example, generated locally with :
#   < /dev/urandom tr -dc _A-Z-a-z-0-9 | head -c${1:-32};echo;



services:
  # apache:
    # image: httpd:latest
    # volumes:
      # - ./httpd.conf:/usr/local/apache2/conf/httpd.conf
    # ports:
      # - "8000:80"
      
  postgres:
    image: postgres:16-alpine
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_PASSWORD: postgres
    volumes:
      - cf_postgres_16_data:/var/lib/postgresql/data/pgdata
      - ./initSql/:/docker-entrypoint-initdb.d/
      - ./restore/:/restore/
    ports:
      - "5433:5432"
    networks:
      - cb_factory

  clamav:
    image: clamav/clamav
    ports:
      - "3310:3310"
    networks:
      - cb_factory

  postgresKC:
    image: postgres:16-alpine
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
    volumes:
      - cf_postgresKC_16_data:/var/lib/postgresql/data/pgdata
    ports:
      - "5434:5432"
    networks:
      - cb_factory

  keycloak:
    image: keycloak/keycloak:26.5.3
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: changeme
      KC_DB_URL_HOST: postgresKC
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_SCHEMA: public
      KC_DB_PASSWORD: keycloak
      KC_DB: postgres
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_LEVEL: INFO
      ##,org.keycloak.connections:DEBUG,org.keycloak.transaction:DEBUG,org.keycloak.services:DEBUG,org.keycloak.authentication:DEBUG
    ports:
      - "8200:8080"
    entrypoint:
      - /opt/keycloak/bin/kc.sh
      - start
      - --verbose
      - --import-realm
      - --features-disabled=impersonation
#      - --optimized
    volumes:
      - ./data/keycloak/import:/opt/keycloak/data/import
    depends_on:
      - postgresKC
    networks:
      - cb_factory

  influxdb:
    image: influxdb:2.8.0-alpine
    volumes:
      #- cf_influxdb_data:/var/lib/influxdb
      - cf_influxdb2_data:/var/lib/influxdb2
      - cf_influxdb2_config:/etc/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      #DOCKER_INFLUXDB_INIT_MODE: upgrade
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: changeme
      DOCKER_INFLUXDB_INIT_ORG: chatbot
      DOCKER_INFLUXDB_INIT_BUCKET: admin
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: influxDevToken
    ports:
      - "8086:8086"
    networks:
      - cb_factory

  chronograph:
    # IHM de consultation influxDB
    image: chronograf:1.10.9-alpine
    volumes:
      - cf_chronograph_data:/var/lib/chronograf
    ports:
      - "8888:8888"
    networks:
      - cb_factory

  analytica:
    image: vertigoio/vertigo-analytics-server:0.14.0
    environment:
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_ORG: chatbot
      INFLUXDB_TOKEN: influxDevToken
    depends_on:
      - influxdb
    ports:
      - "4562:4562"
    networks:
      - cb_factory

  rasa:
    image: rasa/rasa:main-full
    environment:
      - LOG_LEVEL=DEBUG
    ports:
      - "5005:5005"
    command:
      - run
      - --enable-api
      - --cors
      - "*"

volumes:
  cf_postgres_16_data:
  cf_postgresKC_16_data:
  cf_influxdb_data:
  cf_influxdb2_data:
  cf_influxdb2_config:
  cf_rabbitmq_data:
  cf_chronograph_data:

networks:
  cb_factory:
