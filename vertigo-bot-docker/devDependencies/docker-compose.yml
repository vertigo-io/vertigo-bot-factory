  clamav:
    image: clamav/clamav
    ports:
      - "3310:3310"
    networks:
      - cb_factory
    volumes:
      - ./data/clamav/clamd-1.5.2.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s
    stop_grace_period: 30s

